<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Postula — prototipo</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182230;
      --muted: #667085;
      --line: #e6eaf0;
      --canvas: #f5f7fa;
      --paper: #fff;
      --navy: #172b4d;
      --blue: #3768e5;
      --blue-soft: #edf2ff;
      --teal: #12847a;
      --green: #21845a;
      --green-soft: #e9f7ef;
      --amber: #a9680b;
      --amber-soft: #fff4df;
      --red: #bd4646;
      --red-soft: #fff0ef;
      --purple: #7255bd;
      --shadow: 0 8px 28px rgba(23, 43, 77, .06);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--canvas); font-size: 14px; }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; }
    .app { min-height: 100vh; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 2; display: flex; width: 246px;
      flex-direction: column; padding: 25px 16px 18px; color: #d8e0ed; background: var(--navy);
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 9px 34px; color: #fff; }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; background: var(--blue); font-weight: 800; }
    .brand-name { font-size: 18px; font-weight: 750; letter-spacing: -.5px; }
    .nav-label { margin: 10px 10px 9px; color: #93a2b8; font-size: 10px; font-weight: 750; letter-spacing: 1.1px; text-transform: uppercase; }
    .nav { display: grid; gap: 4px; }
    .nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: #c4cfdf; transition: .15s; }
    .nav a:hover, .nav a.active { color: #fff; background: #293e60; }
    .nav a.active { box-shadow: inset 3px 0 var(--blue); }
    .nav-icon { width: 18px; color: #aebbd0; text-align: center; font-size: 16px; }
    .sidebar-bottom { margin-top: auto; padding: 15px 10px 0; border-top: 1px solid #344762; color: #aebbd0; font-size: 12px; }
    .profile { display: flex; align-items: center; gap: 10px; }
    .avatar { display: grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; border-radius: 50%; color: #264b9b; background: #e5edff; font-weight: 700; }
    .main { min-height: 100vh; margin-left: 246px; }
    .topbar { display: flex; height: 70px; align-items: center; justify-content: space-between; padding: 0 38px; border-bottom: 1px solid var(--line); background: var(--paper); }
    .crumb { color: var(--muted); font-size: 13px; }
    .crumb strong { color: var(--ink); font-weight: 650; }
    .top-right { display: flex; align-items: center; gap: 17px; color: var(--muted); }
    .page { max-width: 1280px; margin: 0 auto; padding: 34px 38px 54px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    h1 { margin: 0; font-size: 26px; letter-spacing: -.7px; }
    h2 { margin: 0; font-size: 17px; letter-spacing: -.2px; }
    h3 { margin: 0; font-size: 14px; }
    p { color: var(--muted); line-height: 1.6; }
    .subtitle { margin: 7px 0 0; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; }
    .btn { display: inline-flex; min-height: 38px; align-items: center; justify-content: center; gap: 7px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; color: #344054; background: #fff; font-weight: 650; transition: .15s; }
    .btn:hover { border-color: #bac7dc; background: #f9fbff; }
    .btn.primary { border-color: var(--blue); color: #fff; background: var(--blue); }
    .btn.primary:hover { background: #2857cf; }
    .btn.small { min-height: 32px; padding: 0 10px; font-size: 12px; }
    .btn.link { min-height: 32px; padding: 0 4px; border: 0; color: var(--blue); background: transparent; }
    .grid { display: grid; gap: 18px; }
    .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 20px; }
    .panel { border: 1px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: var(--shadow); }
    .stat-card { padding: 18px 20px; }
    .stat-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; font-weight: 600; }
    .stat-value { margin: 12px 0 5px; font-size: 29px; font-weight: 750; letter-spacing: -1px; }
    .stat-note { color: var(--muted); font-size: 11px; }
    .stat-icon { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 10px; color: var(--blue); background: var(--blue-soft); font-size: 16px; }
    .filters { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; padding: 17px 18px; border-bottom: 1px solid var(--line); }
    .field { display: grid; min-width: 145px; flex: 1; gap: 6px; }
    .field label { color: #475467; font-size: 12px; font-weight: 650; }
    input, select, textarea { width: 100%; min-height: 39px; padding: 9px 11px; border: 1px solid #d8dee8; border-radius: 7px; outline: 0; color: var(--ink); background: #fff; }
    textarea { min-height: 92px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: #7192ed; box-shadow: 0 0 0 3px #3768e51a; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
    th { padding: 12px 18px; color: #667085; background: #fafbfd; font-size: 10px; font-weight: 750; letter-spacing: .7px; text-transform: uppercase; }
    td { padding: 15px 18px; border-top: 1px solid #edf0f4; }
    tbody tr:hover { background: #fafcff; }
    .role { color: var(--blue); font-weight: 680; }
    .company-cell { display: flex; align-items: center; gap: 10px; }
    .company-logo { display: grid; width: 32px; height: 32px; place-items: center; border: 1px solid var(--line); border-radius: 8px; color: var(--navy); background: #f7f8fb; font-size: 11px; font-weight: 750; }
    .company-name { font-weight: 650; }
    .company-sub { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 99px; font-size: 11px; font-weight: 700; }
    .badge:before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; }
    .b-pendiente { color: var(--amber); background: var(--amber-soft); }
    .b-entrevista { color: var(--blue); background: var(--blue-soft); }
    .b-aceptado { color: var(--green); background: var(--green-soft); }
    .b-rechazado { color: var(--red); background: var(--red-soft); }
    .table-foot { display: flex; justify-content: space-between; padding: 14px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .two-col { grid-template-columns: minmax(0, 1.5fr) minmax(250px, .8fr); align-items: start; }
    .panel-pad { padding: 21px; }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 17px; }
    .detail-title { display: flex; align-items: center; gap: 14px; }
    .detail-title .company-logo { width: 52px; height: 52px; font-size: 15px; }
    .detail-title h1 { font-size: 24px; }
    .key-values { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .kv label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 11px; }
    .kv strong { font-size: 13px; font-weight: 650; }
    .note { padding: 14px; border-radius: 8px; color: #475467; background: #f7f8fb; line-height: 1.6; }
    .timeline { display: grid; gap: 0; }
    .timeline-item { position: relative; padding: 0 0 19px 24px; border-left: 1px solid #d9e1ef; }
    .timeline-item:last-child { padding-bottom: 0; border-left-color: transparent; }
    .timeline-item:before { position: absolute; top: 2px; left: -5px; width: 9px; height: 9px; border: 2px solid #fff; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 1px var(--blue); content: ""; }
    .timeline-date { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 17px; }
    .field.full { grid-column: 1 / -1; }
    .form-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 23px; padding-top: 18px; border-top: 1px solid var(--line); }
    .company-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0; border-top: 1px solid var(--line); }
    .company-card:first-of-type { border-top: 0; }
    .company-card-left { display: flex; align-items: center; gap: 11px; }
    .inline-form { display: grid; gap: 12px; }
    .interview-row { display: grid; grid-template-columns: 86px 1fr auto; align-items: center; gap: 15px; padding: 17px 0; border-top: 1px solid var(--line); }
    .date-box { padding: 8px; border-radius: 8px; color: var(--blue); background: var(--blue-soft); text-align: center; font-weight: 750; }
    .date-box small { display: block; margin-top: 3px; font-size: 10px; text-transform: uppercase; }
    .chart { display: flex; height: 205px; align-items: end; gap: 14px; padding: 14px 8px 0; border-bottom: 1px solid var(--line); }
    .bar-group { display: grid; height: 100%; flex: 1; align-content: end; justify-items: center; gap: 7px; color: var(--muted); font-size: 10px; }
    .bar { width: min(40px, 72%); min-height: 8px; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, #7292f4, #3768e5); }
    .legend { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 14px; color: var(--muted); font-size: 11px; }
    .legend span:before { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 3px; background: var(--blue); content: ""; }
    .ai-box { display: flex; min-height: 390px; flex-direction: column; }
    .ai-messages { display: grid; flex: 1; align-content: start; gap: 14px; padding: 12px 0 22px; }
    .message { max-width: 82%; padding: 12px 14px; border-radius: 11px; color: #475467; background: #f4f6fa; line-height: 1.6; }
    .message.user { justify-self: end; color: #fff; background: var(--blue); }
    .chat-form { display: flex; gap: 9px; padding-top: 14px; border-top: 1px solid var(--line); }
    .chat-form input { flex: 1; }
    .swatches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .swatch { overflow: hidden; border: 1px solid var(--line); border-radius: 9px; }
    .swatch-color { height: 58px; }
    .swatch-caption { padding: 9px; font-size: 11px; }
    .empty { padding: 45px 20px; color: var(--muted); text-align: center; }
    .toast { position: fixed; right: 25px; bottom: 25px; z-index: 5; padding: 12px 17px; border-radius: 9px; color: #fff; background: #1b3a5d; box-shadow: var(--shadow); opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 1000px) { .sidebar { width: 210px; } .main { margin-left: 210px; } .page { padding: 26px 24px; } .topbar { padding: 0 24px; } .stats { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 720px) {
      .sidebar { position: static; width: auto; height: auto; padding: 10px 12px; }
      .brand { padding: 0 7px 9px; }
      .nav-label, .sidebar-bottom { display: none; }
      .nav { grid-template-columns: repeat(4, 1fr); gap: 3px; }
      .nav a { justify-content: center; padding: 9px 4px; font-size: 10px; }
      .nav-icon { display: none; }
      .main { margin-left: 0; }
      .topbar { height: 52px; padding: 0 18px; }
      .page { padding: 24px 16px 40px; }
      .page-head { align-items: flex-start; flex-direction: column; }
      .stats { gap: 10px; }
      .stat-card { padding: 13px; }
      .stat-value { font-size: 24px; }
      .two-col { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .swatches { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#candidaturas"><span class="brand-mark">P</span><span class="brand-name">postula</span></a>
      <div class="nav-label">Espacio de trabajo</div>
      <nav class="nav" aria-label="Navegación principal">
        <a href="#candidaturas" data-nav="candidaturas"><span class="nav-icon">▤</span>Candidaturas</a>
        <a href="#empresas" data-nav="empresas"><span class="nav-icon">▦</span>Empresas</a>
        <a href="#entrevistas" data-nav="entrevistas"><span class="nav-icon">◷</span>Entrevistas</a>
        <a href="#estadisticas" data-nav="estadisticas"><span class="nav-icon">▥</span>Estadísticas</a>
        <a href="#asistente" data-nav="asistente"><span class="nav-icon">✦</span>Asistente IA</a>
      </nav>
      <div class="nav-label" style="margin-top:28px">Personalización</div>
      <nav class="nav"><a href="#estilo" data-nav="estilo"><span class="nav-icon">◈</span>Manual de estilo</a></nav>
      <div class="sidebar-bottom">
        <div class="profile"><span class="avatar">AM</span><span><strong style="display:block;color:#fff">Alex Martín</strong><span>Mi espacio</span></span></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="crumb">Espacio de trabajo <span style="padding:0 8px">/</span><strong id="breadcrumb">Candidaturas</strong></div><div class="top-right"><span>⌕</span><span>⌁</span><span class="avatar" style="width:29px;height:29px;font-size:11px">AM</span></div></header>
      <section class="page" id="screen"></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const applications = [
      { id: 13, title: "Product Designer", company: "Nubank", status: "entrevista", date: "21/10/2026", logo: "N", source: "LinkedIn", note: "Buscan perfil con experiencia en producto financiero. Preparar portfolio de onboarding." },
      { id: 12, title: "UX/UI Designer", company: "Cabify", status: "pendiente", date: "19/10/2026", logo: "C", source: "Web de empresa", note: "Solicitud enviada desde la página de empleo." },
      { id: 11, title: "Diseñadora de producto", company: "Glovo", status: "aceptado", date: "16/10/2026", logo: "G", source: "Referido", note: "Oferta recibida. Revisar condiciones antes del viernes." },
      { id: 10, title: "Product Designer II", company: "Typeform", status: "rechazado", date: "11/10/2026", logo: "T", source: "LinkedIn", note: "Proceso cerrado después de la primera entrevista." },
      { id: 9, title: "Diseñadora UX", company: "Figma", status: "pendiente", date: "08/10/2026", logo: "F", source: "Web de empresa", note: "Adaptar portfolio a herramientas colaborativas." }
    ];
    const companies = [
      { name: "Nubank", sector: "Fintech · Madrid", count: 2, logo: "N" },
      { name: "Cabify", sector: "Movilidad · Madrid", count: 1, logo: "C" },
      { name: "Glovo", sector: "Delivery · Barcelona", count: 3, logo: "G" },
      { name: "Typeform", sector: "Software · Barcelona", count: 1, logo: "T" }
    ];
    const label = { pendiente: "Pendiente", entrevista: "Entrevista", aceptado: "Aceptado", rechazado: "Rechazado" };
    const screen = document.querySelector("#screen");
    const titleText = (text, subtitle = "") => `<div class="page-head"><div><h1>${text}</h1>${subtitle ? `<p class="subtitle">${subtitle}</p>` : ""}</div>`;
    const panel = (body, extra = "") => `<section class="panel ${extra}">${body}</section>`;
    const statusBadge = status => `<span class="badge b-${status}">${label[status] || status}</span>`;
    const logo = (text, cls = "") => `<span class="company-logo ${cls}">${text}</span>`;
    const companyFor = name => companies.find(c => c.name === name) || { logo: name.slice(0,1).toUpperCase() };
    function navigate(hash) { location.hash = hash; }
    function toast(message) {
      const el = document.querySelector("#toast");
      el.textContent = message; el.classList.add("show");
      clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.remove("show"), 2400);
    }
    function tableRows(rows) {
      if (!rows.length) return `<tr><td colspan="5"><div class="empty">No hay resultados. Prueba a cambiar los filtros.</div></td></tr>`;
      return rows.map(a => `<tr data-open="${a.id}" style="cursor:pointer"><td><div class="company-cell">${logo(companyFor(a.company).logo)}<div><div class="role">${a.title}</div><div class="company-sub">ID ${a.id}</div></div></div></td><td>${a.company}</td><td>${statusBadge(a.status)}</td><td>${a.date}</td><td><button class="btn link small" data-open="${a.id}">Ver detalle →</button></td></tr>`).join("");
    }
    function listing() {
      return `${titleText("Candidaturas", "Sigue cada oportunidad y mantén tu búsqueda organizada.")}<div class="actions"><button class="btn primary" data-go="nueva">＋ Nueva candidatura</button></div></div>
        <div class="grid stats">
          ${[["Total candidaturas", applications.length, "Todas tus oportunidades", "▤"],["En proceso", applications.filter(a => ["pendiente","entrevista"].includes(a.status)).length, "Pendientes y entrevistas", "◷"],["Entrevistas", "3", "1 esta semana", "▣"],["Tasa de respuesta", "64%", "↑ 12% respecto al mes pasado", "↗"]].map(s => panel(`<div class="stat-top">${s[0]}<span class="stat-icon">${s[3]}</span></div><div class="stat-value">${s[1]}</div><div class="stat-note">${s[2]}</div>`, "stat-card")).join("")}
        </div>
        ${panel(`<div class="filters"><div class="field"><label for="search">Buscar</label><input id="search" placeholder="Puesto o empresa"></div><div class="field" style="max-width:190px"><label for="status-filter">Estado</label><select id="status-filter"><option value="">Todos los estados</option>${Object.entries(label).map(([v,t]) => `<option value="${v}">${t}</option>`).join("")}</select></div><button class="btn" id="clear-filters">Limpiar filtros</button></div>
        <div class="table-wrap"><table><thead><tr><th>Puesto</th><th>Empresa</th><th>Estado</th><th>Fecha de alta</th><th></th></tr></thead><tbody id="application-rows">${tableRows(applications)}</tbody></table></div><div class="table-foot"><span id="result-count">Mostrando ${applications.length} candidaturas</span><span>1–${applications.length} de ${applications.length}</span></div>`)}`;
    }
    function detail() {
      const id = Number(location.hash.split("/")[1]) || 13;
      const a = applications.find(item => item.id === id) || applications[0];
      return `${titleText("Detalle de candidatura", "Candidaturas / Detalle")}<div class="actions"><button class="btn" data-go="candidaturas">← Volver</button><button class="btn" data-go="editar">Editar candidatura</button></div></div>
        <div class="grid two-col">
          <div class="grid">
            ${panel(`<div class="section-title"><div class="detail-title">${logo(companyFor(a.company).logo)}<div><h1>${a.title}</h1><p class="subtitle" style="margin:4px 0">${a.company} · ${a.source}</p></div></div>${statusBadge(a.status)}</div><div class="key-values"><div class="kv"><label>Empresa</label><strong>${a.company}</strong></div><div class="kv"><label>Fecha de candidatura</label><strong>${a.date}</strong></div><div class="kv"><label>Ubicación</label><strong>Madrid, España · Híbrido</strong></div><div class="kv"><label>Enlace de la oferta</label><a href="#" class="role">Ver oferta ↗</a></div></div>`, "panel-pad")}
            ${panel(`<div class="section-title"><h2>Notas</h2><button class="btn link small" data-go="editar">Editar</button></div><div class="note">${a.note}</div>`, "panel-pad")}
          </div>
          <div class="grid">
            ${panel(`<div class="section-title"><h2>Próximas entrevistas</h2><button class="btn link small" data-go="entrevistas">Ver todas</button></div><div class="timeline"><div class="timeline-item"><strong>Entrevista con Talent</strong><div class="timeline-date">Jueves, 29 oct · 11:30 · Videollamada</div></div><div class="timeline-item"><strong>Solicitud enviada</strong><div class="timeline-date">${a.date} · ${a.source}</div></div></div><button class="btn small" style="margin-top:18px" data-go="entrevistas">＋ Añadir entrevista</button>`, "panel-pad")}
            ${panel(`<div class="section-title"><h2>Actividad</h2><span style="color:var(--muted);font-size:11px">Últimos movimientos</span></div><div class="timeline"><div class="timeline-item"><strong>Estado actualizado</strong><div class="timeline-date">Hoy · Entrevista</div></div><div class="timeline-item"><strong>Nota añadida</strong><div class="timeline-date">Ayer · Alex Martín</div></div></div>`, "panel-pad")}
          </div>
        </div>`;
    }
    function applicationForm() {
      return `${titleText("Nueva candidatura", "Añade una oportunidad para tenerla siempre a mano.")}<div class="actions"><button class="btn" data-go="candidaturas">Cancelar</button></div></div>
        ${panel(`<form id="application-form"><div class="form-grid">
          <div class="field"><label for="f-title">Título del puesto *</label><input id="f-title" name="title" placeholder="Ej. Product Designer" required></div>
          <div class="field"><label for="f-company">Empresa *</label><input id="f-company" name="company" placeholder="Nombre de la empresa" required></div>
          <div class="field"><label for="f-status">Estado</label><select id="f-status" name="status"><option value="pendiente">Pendiente</option><option value="entrevista">Entrevista</option><option value="aceptado">Aceptado</option><option value="rechazado">Rechazado</option></select></div>
          <div class="field"><label for="f-date">Fecha de candidatura *</label><input id="f-date" name="date" type="date" required></div>
          <div class="field"><label for="f-source">Fuente</label><select id="f-source" name="source"><option>LinkedIn</option><option>Web de empresa</option><option>Referido</option><option>Otro</option></select></div>
          <div class="field"><label for="f-link">Enlace de la oferta</label><input id="f-link" type="url" placeholder="https://"></div>
          <div class="field full"><label for="f-note">Notas</label><textarea id="f-note" name="note" placeholder="Detalles que quieras recordar…"></textarea></div>
        </div><div class="form-actions"><button class="btn" type="button" data-go="candidaturas">Cancelar</button><button class="btn primary" type="submit">Guardar candidatura</button></div></form>`, "panel panel-pad")}`;
    }
    function companiesScreen() {
      return `${titleText("Empresas", "Organiza tus contactos y oportunidades por empresa.")}<div class="actions"><button class="btn primary" data-go="empresa-nueva">＋ Añadir empresa</button></div></div>
        <div class="grid two-col">
          ${panel(`<div class="section-title"><h2>Directorio de empresas</h2><span style="color:var(--muted);font-size:12px">${companies.length} empresas</span></div><div>${companies.map(c => `<div class="company-card"><div class="company-card-left">${logo(c.logo)}<div><div class="company-name">${c.name}</div><div class="company-sub">${c.sector}</div></div></div><span class="badge b-entrevista">${c.count} candidatura${c.count === 1 ? "" : "s"}</span></div>`).join("")}</div>`, "panel panel-pad")}
          ${panel(`<div class="section-title"><h2>Añadir empresa</h2></div><form class="inline-form" id="company-form"><div class="field"><label>Nombre *</label><input name="name" placeholder="Nombre de la empresa" required></div><div class="field"><label>Sector</label><input name="sector" placeholder="Ej. Tecnología"></div><div class="field"><label>Ubicación</label><input name="location" placeholder="Ciudad"></div><div class="field"><label>Web</label><input type="url" placeholder="https://"></div><button class="btn primary" type="submit">Guardar empresa</button></form>`, "panel panel-pad")}
        </div>`;
    }
    function interviewsScreen() {
      return `${titleText("Entrevistas", "Prepara cada conversación y no pierdas ninguna fecha.")}<div class="actions"><button class="btn primary" data-go="entrevista-nueva">＋ Programar entrevista</button></div></div>
        <div class="grid two-col">
          ${panel(`<div class="section-title"><h2>Próximas entrevistas</h2><span class="badge b-entrevista">2 próximas</span></div>
            ${[["29","OCT","Nubank","Product Designer · Entrevista con Talent","11:30 · Videollamada"],["03","NOV","Cabify","UX/UI Designer · Entrevista técnica","16:00 · Madrid"]].map(i => `<div class="interview-row"><div class="date-box">${i[0]}<small>${i[1]}</small></div><div><strong>${i[2]}</strong><div style="margin-top:5px">${i[3]}</div><div class="company-sub">${i[4]}</div></div><button class="btn small" data-go="detalle/13">Ver candidatura</button></div>`).join("")}
            <div class="section-title" style="margin-top:28px"><h2>Historial</h2></div><div class="interview-row"><div class="date-box" style="color:var(--muted);background:#f2f4f7">18<small>OCT</small></div><div><strong>Glovo · Primera entrevista</strong><div class="company-sub">Completada · 10:00</div></div>${statusBadge("aceptado")}</div>`, "panel panel-pad")}
          ${panel(`<div class="section-title"><h2>Programar entrevista</h2></div><form class="inline-form" id="interview-form"><div class="field"><label>Candidatura *</label><select required><option value="">Selecciona una candidatura</option>${applications.map(a => `<option>${a.title} · ${a.company}</option>`).join("")}</select></div><div class="field"><label>Tipo de entrevista</label><select><option>Primera entrevista</option><option>Entrevista técnica</option><option>Entrevista final</option><option>Otra</option></select></div><div class="field"><label>Fecha y hora *</label><input type="datetime-local" required></div><div class="field"><label>Formato</label><select><option>Videollamada</option><option>Presencial</option><option>Teléfono</option></select></div><div class="field"><label>Notas</label><textarea placeholder="Enlace, persona de contacto…"></textarea></div><button class="btn primary" type="submit">Guardar entrevista</button></form>`, "panel panel-pad")}
        </div>`;
    }
    function statsScreen() {
      const bars = [["Jun",38],["Jul",62],["Ago",49],["Sep",78],["Oct",92]];
      return `${titleText("Estadísticas", "Una visión clara de tu búsqueda de empleo.")}<div class="actions"><button class="btn">Últimos 6 meses　⌄</button><button class="btn">Exportar informe ↓</button></div></div>
        <div class="grid stats">${[["Candidaturas enviadas","24","↑ 18% vs. periodo anterior","▤"],["Tasa de respuesta","64%","15 respuestas recibidas","↗"],["Entrevistas","8","3 procesos activos","◷"],["Tiempo medio de respuesta","5,2 días","−1,4 días vs. periodo anterior","◷"]].map(s => panel(`<div class="stat-top">${s[0]}<span class="stat-icon">${s[3]}</span></div><div class="stat-value">${s[1]}</div><div class="stat-note">${s[2]}</div>`, "stat-card")).join("")}</div>
        <div class="grid two-col">
          ${panel(`<div class="section-title"><div><h2>Actividad de candidaturas</h2><p class="subtitle">Candidaturas enviadas por mes</p></div><button class="btn small">2026 ⌄</button></div><div class="chart">${bars.map(b => `<div class="bar-group"><div class="bar" style="height:${b[1]}%"></div><span>${b[0]}</span></div>`).join("")}</div><div class="legend"><span>Enviadas</span></div>`, "panel panel-pad")}
          ${panel(`<div class="section-title"><h2>Por estado</h2><button class="btn link small">Ver candidaturas</button></div><div class="grid" style="gap:16px">${[["Entrevista",8,33,"var(--blue)"],["Pendiente",9,38,"var(--amber)"],["Aceptado",3,13,"var(--green)"],["Rechazado",4,16,"var(--red)"]].map(s => `<div><div style="display:flex;justify-content:space-between;margin-bottom:7px"><span>${s[0]}</span><strong>${s[1]} <span style="color:var(--muted);font-weight:400">· ${s[2]}%</span></strong></div><div style="height:7px;border-radius:8px;background:#eef1f5"><div style="height:100%;width:${s[2]}%;border-radius:8px;background:${s[3]}"></div></div></div>`).join("")}</div>`, "panel panel-pad")}
        </div>`;
    }
    function assistantScreen() {
      return `${titleText("Asistente IA", "Ideas y preparación para dar el siguiente paso.")}<div class="actions"><span class="badge b-aceptado">● Asistente disponible</span></div></div>
        <div class="grid two-col">
          ${panel(`<div class="section-title"><div><h2>Tu conversación</h2><div class="company-sub">Asistente de búsqueda de empleo</div></div><button class="btn small" id="clear-chat">Nueva conversación</button></div><div class="ai-box"><div class="ai-messages" id="messages"><div class="message">¡Hola, Alex! Puedo ayudarte a preparar entrevistas, revisar tu estrategia de búsqueda o adaptar tu perfil a una oferta. ¿Por dónde empezamos?</div><div class="message user">Ayúdame a prepararme para la entrevista de Product Designer en Nubank.</div><div class="message">¡Claro! Para la entrevista con Nubank, te propongo preparar tres bloques: tu proceso de diseño de producto, cómo tomas decisiones basadas en datos y un caso de impacto medible. ¿Quieres que practiquemos preguntas de producto o que revisemos un proyecto de tu portfolio?</div></div><form class="chat-form" id="chat-form"><input id="chat-input" placeholder="Escribe tu pregunta…" required><button class="btn primary" type="submit">Enviar ↑</button></form></div>`, "panel panel-pad")}
          <div class="grid">${panel(`<div class="section-title"><h2>Sugerencias para ti</h2><span style="color:var(--purple)">✦</span></div><div class="grid" style="gap:10px"><button class="btn" data-prompt="Dame preguntas habituales de entrevista">Preparar preguntas de entrevista →</button><button class="btn" data-prompt="Ayúdame a mejorar mi CV para diseño de producto">Mejorar mi CV →</button><button class="btn" data-prompt="Analiza mi búsqueda de empleo">Analizar mi búsqueda →</button></div>`, "panel panel-pad")}
            ${panel(`<div class="section-title"><h2>Contexto conectado</h2></div><div class="kv" style="margin-bottom:14px"><label>Candidatura activa</label><strong>Product Designer · Nubank</strong></div><div class="kv"><label>Estado</label>${statusBadge("entrevista")}</div><p style="font-size:12px;margin-bottom:0">El asistente utiliza los datos de tu espacio para contextualizar sus sugerencias.</p>`, "panel panel-pad")}</div>
        </div>`;
    }
    function styleScreen() {
      const colors = [["Principal · Azul","var(--blue)"],["Secundario · Teal","var(--teal)"],["Fondo · Niebla","var(--canvas)"],["Texto · Tinta","var(--ink)"],["Pendiente · Ámbar","var(--amber)"],["Entrevista · Azul","var(--blue)"],["Aceptado · Verde","var(--green)"],["Rechazado · Rojo","var(--red)"]];
      return `${titleText("Manual de estilo", "Sistema visual de Postula · versión 1.0")}</div>
        ${panel(`<div class="section-title"><h2>Identidad visual</h2></div><div class="detail-title">${logo("P")}<div><strong style="font-size:20px">postula</strong><p class="subtitle" style="margin:3px 0">Tu camino profesional, en orden.</p></div></div><p>Una identidad clara y cercana que combina la confianza de un azul profundo con la energía de un azul eléctrico. El isotipo P representa un camino y un punto de avance.</p><div class="section-title" style="margin-top:25px"><h2>Paleta de color</h2></div><div class="swatches">${colors.map(c => `<div class="swatch"><div class="swatch-color" style="background:${c[1]}"></div><div class="swatch-caption">${c[0]}</div></div>`).join("")}</div>`, "panel panel-pad")}
        <div class="grid two-col" style="margin-top:18px">
          ${panel(`<div class="section-title"><h2>Tipografía</h2></div><div style="font-size:27px;font-weight:750;letter-spacing:-.7px">Inter · Títulos</div><p>Inter semibold/bold, 24–32 px. Para titulares y jerarquías principales.</p><div style="font-size:15px">Inter regular · Texto de interfaz y cuerpo</div><p>Inter regular/medium, 14–16 px, interlineado 1.5.</p><div style="font:13px ui-monospace,Consolas,monospace">IBM Plex Mono · IDs y datos</div><p>Monoespaciada para identificadores y valores técnicos.</p>`, "panel panel-pad")}
          ${panel(`<div class="section-title"><h2>Componentes</h2></div><div class="actions" style="margin-bottom:17px"><button class="btn primary">Acción principal</button><button class="btn">Secundaria</button><button class="btn link">Enlace →</button></div><div style="margin-bottom:18px">${statusBadge("pendiente")} ${statusBadge("entrevista")} ${statusBadge("aceptado")} ${statusBadge("rechazado")}</div><div class="field" style="margin-bottom:14px"><label>Campo de formulario</label><input placeholder="Texto de ejemplo"></div><div class="note">Tarjetas y formularios usan superficie blanca, borde sutil y esquinas de 8–12 px.</div>`, "panel panel-pad")}
        </div>`;
    }
    function render() {
      const route = location.hash.slice(1) || "candidaturas";
      const root = route.split("/")[0];
      const screens = {
        candidaturas: ["Candidaturas", listing],
        detalle: ["Detalle", detail],
        nueva: ["Nueva candidatura", applicationForm],
        editar: ["Editar candidatura", applicationForm],
        empresas: ["Empresas", companiesScreen],
        "empresa-nueva": ["Empresas", companiesScreen],
        entrevistas: ["Entrevistas", interviewsScreen],
        "entrevista-nueva": ["Entrevistas", interviewsScreen],
        estadisticas: ["Estadísticas", statsScreen],
        asistente: ["Asistente IA", assistantScreen],
        estilo: ["Manual de estilo", styleScreen]
      };
      const current = screens[root] || screens.candidaturas;
      document.querySelector("#breadcrumb").textContent = current[0];
      document.querySelectorAll("[data-nav]").forEach(link => link.classList.toggle("active", link.dataset.nav === root || (root === "editar" && link.dataset.nav === "candidaturas")));
      screen.innerHTML = current[1]();
      wireScreen();
    }
    function wireScreen() {
      screen.querySelectorAll("[data-go]").forEach(button => button.addEventListener("click", () => navigate(button.dataset.go === "editar" ? "nueva" : button.dataset.go)));
      screen.querySelectorAll("[data-open]").forEach(el => el.addEventListener("click", event => {
        event.stopPropagation(); navigate(`detalle/${el.dataset.open}`);
      }));
      const search = screen.querySelector("#search");
      if (search) {
        const filter = () => {
          const query = search.value.toLowerCase();
          const status = screen.querySelector("#status-filter").value;
          const matches = applications.filter(a => `${a.title} ${a.company}`.toLowerCase().includes(query) && (!status || a.status === status));
          screen.querySelector("#application-rows").innerHTML = tableRows(matches);
          screen.querySelector("#result-count").textContent = `Mostrando ${matches.length} candidatura${matches.length === 1 ? "" : "s"}`;
          wireRows();
        };
        search.addEventListener("input", filter);
        screen.querySelector("#status-filter").addEventListener("change", filter);
        screen.querySelector("#clear-filters").addEventListener("click", () => { search.value = ""; screen.querySelector("#status-filter").value = ""; filter(); });
      }
      wireRows();
      const applicationFormEl = screen.querySelector("#application-form");
      if (applicationFormEl) applicationFormEl.addEventListener("submit", event => {
        event.preventDefault();
        const data = new FormData(applicationFormEl);
        applications.unshift({ id: Math.max(...applications.map(a => a.id)) + 1, title: data.get("title"), company: data.get("company"), status: data.get("status"), date: new Date(data.get("date") + "T12:00:00").toLocaleDateString("es-ES"), logo: String(data.get("company")).slice(0,1).toUpperCase(), source: data.get("source"), note: data.get("note") || "Sin notas." });
        navigate("candidaturas"); setTimeout(() => toast("Candidatura guardada correctamente."), 50);
      });
      for (const id of ["company-form", "interview-form"]) {
        const form = screen.querySelector(`#${id}`);
        if (form) form.addEventListener("submit", event => { event.preventDefault(); form.reset(); toast(id === "company-form" ? "Empresa guardada en el prototipo." : "Entrevista programada en el prototipo."); });
      }
      const chat = screen.querySelector("#chat-form");
      if (chat) chat.addEventListener("submit", event => {
        event.preventDefault(); const input = screen.querySelector("#chat-input"); if (!input.value.trim()) return;
        const message = document.createElement("div"); message.className = "message user"; message.textContent = input.value;
        screen.querySelector("#messages").append(message); input.value = "";
        const reply = document.createElement("div"); reply.className = "message"; reply.textContent = "Buena pregunta. Para esta demo, piensa en un ejemplo concreto, explica tu proceso y termina con el impacto que generaste. Puedes seguir explorando tus candidaturas y entrevistas desde el menú.";
        screen.querySelector("#messages").append(reply);
      });
      screen.querySelectorAll("[data-prompt]").forEach(button => button.addEventListener("click", () => { screen.querySelector("#chat-input").value = button.dataset.prompt; screen.querySelector("#chat-input").focus(); }));
      const clearChat = screen.querySelector("#clear-chat");
      if (clearChat) clearChat.addEventListener("click", () => { screen.querySelector("#messages").innerHTML = '<div class="message">¡Hola, Alex! ¿En qué puedo ayudarte con tu búsqueda de empleo?</div>'; });
    }
    function wireRows() {
      screen.querySelectorAll("#application-rows [data-open]").forEach(el => el.addEventListener("click", () => navigate(`detalle/${el.dataset.open}`)));
    }
    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
